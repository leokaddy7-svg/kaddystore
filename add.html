<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<style>
:root{--bg:#0b0f14;--card:#131a22;--text:#f2f4f7;--muted:#9aa5b1;--line:#243040;--red:#E0201B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:12px 12px 90px}
h1{font-size:20px;margin:4px 0 12px;border-bottom:3px solid var(--red);padding-bottom:8px}
h2{font-size:16px;margin:0 0 10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0b0f14;color:var(--text);font-size:15px;font-family:inherit}
textarea{min-height:110px}
button{padding:11px 14px;border-radius:10px;border:0;background:var(--red);color:#fff;font-weight:700;font-size:14px;margin-top:10px}
button.alt{background:#243040}
button.small{padding:7px 10px;font-size:12px;margin:0}
.row{display:flex;gap:8px}
.row>*{flex:1}
#msg{position:fixed;left:0;right:0;bottom:70px;margin:0 12px;padding:10px 12px;border-radius:10px;background:#243040;font-size:13px;display:none;z-index:20}
#pubbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 12px;z-index:20}
#pubbar button{width:100%;margin:0;padding:14px;font-size:16px}
.p{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.p img{width:48px;height:48px;object-fit:cover;border-radius:8px;background:#fff;flex:none}
.p .t{flex:1;min-width:0;font-size:13px}
.p .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p .t span{color:var(--muted);font-size:12px}
#prev{width:90px;height:90px;object-fit:cover;border-radius:10px;background:#fff;margin-top:8px;display:none}
.note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
</style>
</head>
<body>
<h1>Store Admin</h1>

<div class="box">
  <h2>1. Settings (one time)</h2>
  <label>GitHub username</label>
  <input id="owner" autocapitalize="none" autocomplete="off">
  <label>Repository name</label>
  <input id="repo" autocapitalize="none" autocomplete="off">
  <label>GitHub token (Contents: read and write, only this repo)</label>
  <input id="token" type="password" autocomplete="off">
  <button id="saveSet" type="button">Save settings &amp; load products</button>
  <div class="note">Saved only in this browser. Never share your token.</div>
</div>

<div class="box">
  <h2>2. Logo</h2>
  <input id="logoFile" type="file" accept="image/*">
  <button id="logoBtn" type="button">Upload as logo</button>
  <div class="note">Saved as images/logo.png and used in the header and tab icon.</div>
</div>

<div class="box">
  <h2 id="formTitle">3. Add a product</h2>
  <label>Name</label><input id="name">
  <label>Category</label><select id="category"></select>
  <label>Price (e.g. $12.99)</label><input id="price">
  <label>AliExpress affiliate link</label><input id="link" autocapitalize="none">
  <label>Description (optional)</label><input id="desc">
  <label>Photo</label>
  <input id="file" type="file" accept="image/*">
  <input id="image" placeholder="or image path / URL" autocapitalize="none" style="margin-top:6px">
  <img id="prev" alt="">
  <div class="row">
    <button id="saveP" type="button">Save product</button>
    <button id="cancelP" type="button" class="alt">Clear</button>
  </div>
</div>

<div class="box">
  <h2>4. Bulk add (Linktree links)</h2>
  <label>Category for all lines</label><select id="bulkCat"></select>
  <label>One per line: Name | link | price</label>
  <textarea id="bulk" placeholder="Smart Watch | https://s.click.aliexpress.com/e/xxxx | $19.99"></textarea>
  <button id="bulkBtn" type="button">Add all</button>
  <div class="note">Price is optional. Add photos afterwards with Edit on each product.</div>
</div>

<div class="box">
  <h2>Products (<span id="count">0</span>)</h2>
  <input id="filter" placeholder="Search list..." style="margin-bottom:6px">
  <div id="list"></div>
</div>

<div id="msg"></div>
<div id="pubbar"><button id="pub" type="button">Publish to site</button></div>

<script>
var CATS = [], PRODS = [], editing = -1, dirty = false;
var $ = function(id){ return document.getElementById(id); };

function say(t, keep){
  var m = $("msg"); m.textContent = t; m.style.display = "block";
  clearTimeout(say.t);
  if(!keep) say.t = setTimeout(function(){ m.style.display = "none"; }, 4000);
}
function ls(k, v){
  try{ if(v === undefined) return localStorage.getItem(k) || ""; localStorage.setItem(k, v); }catch(e){ return ""; }
}
function cfg(){ return { o: $("owner").value.trim(), r: $("repo").value.trim(), t: $("token").value.trim() }; }
function api(path){ var c = cfg(); return "https://api.github.com/repos/" + c.o + "/" + c.r + "/contents/" + path; }
function hdr(){ return { "Authorization": "Bearer " + cfg().t, "Accept": "application/vnd.github+json" }; }
function enc(s){ return btoa(unescape(encodeURIComponent(s))); }
function dec(b){ return decodeURIComponent(escape(atob(b.replace(/\n/g, "")))); }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

async function getFile(path){
  var r = await fetch(api(path) + "?t=" + Date.now(), { headers: hdr() });
  if(r.status === 404) return null;
  if(!r.ok) throw new Error("GitHub error " + r.status + " (check username, repo, token)");
  return await r.json();
}
async function putFile(path, b64, msg){
  var ex = await getFile(path);
  var body = { message: msg, content: b64 };
  if(ex && ex.sha) body.sha = ex.sha;
  var r = await fetch(api(path), { method: "PUT", headers: hdr(), body: JSON.stringify(body) });
  if(!r.ok) throw new Error("Upload failed (" + r.status + ")");
  return await r.json();
}

function fillCats(){
  var h = CATS.map(function(c){ return '<option>' + esc(c) + '</option>'; }).join("");
  var a = $("category").value, b = $("bulkCat").value;
  $("category").innerHTML = h; $("bulkCat").innerHTML = h;
  if(a) $("category").value = a;
  if(b) $("bulkCat").value = b;
}

function drawList(){
  var f = $("filter").value.toLowerCase();
  $("count").textContent = PRODS.length;
  var out = "";
  PRODS.forEach(function(p, i){
    if(f && (p.name + " " + p.category).toLowerCase().indexOf(f) < 0) return;
    out += '<div class="p"><img src="' + esc(p.image) + '" alt="" onerror="this.style.opacity=.2">' +
      '<div class="t"><b>' + esc(p.name) + '</b><span>' + esc(p.category) + ' · ' + esc(p.price) + '</span></div>' +
      '<button class="small alt" data-e="' + i + '">Edit</button>' +
      '<button class="small" data-d="' + i + '">Del</button></div>';
  });
  $("list").innerHTML = out || '<div class="note">No products yet.</div>';
  Array.prototype.forEach.call(document.querySelectorAll("[data-e]"), function(b){
    b.onclick = function(){ startEdit(+b.getAttribute("data-e")); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-d]"), function(b){
    b.onclick = function(){
      var i = +b.getAttribute("data-d");
      if(confirm("Delete " + PRODS[i].name + "?")){ PRODS.splice(i, 1); mark(); drawList(); }
    };
  });
}
function mark(){ dirty = true; $("pub").textContent = "Publish to site (unsaved changes)"; }

function clearForm(){
  editing = -1;
  ["name","price","link","desc","image"].forEach(function(k){ $(k).value = ""; });
  $("file").value = ""; $("prev").style.display = "none";
  $("formTitle").textContent = "3. Add a product";
}
function startEdit(i){
  var p = PRODS[i]; editing = i;
  $("name").value = p.name; $("category").value = p.category; $("price").value = p.price || "";
  $("link").value = p.link; $("desc").value = p.desc || ""; $("image").value = p.image || "";
  showPrev();
  $("formTitle").textContent = "Editing product";
  window.scrollTo(0, 0);
}
function showPrev(){
  var v = $("image").value.trim();
  if(v){ $("prev").src = v; $("prev").style.display = "block"; } else $("prev").style.display = "none";
}

function resize(file, max, type, q){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onerror = rej;
    fr.onload = function(){
      var im = new Image();
      im.onerror = rej;
      im.onload = function(){
        var s = Math.min(1, max / Math.max(im.width, im.height));
        var c = document.createElement("canvas");
        c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
        var x = c.getContext("2d");
        if(type === "image/jpeg"){ x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); }
        x.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL(type, q).split(",")[1]);
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function loadProducts(){
  try{
    say("Loading...", true);
    var f = await getFile("products.js");
    if(!f) throw new Error("products.js not found in this repo");
    var code = dec(f.content);
    var o = new Function(code + "; return {c: CATEGORIES, p: PRODUCTS};")();
    CATS = o.c; PRODS = o.p; dirty = false;
    $("pub").textContent = "Publish to site";
    fillCats(); drawList(); say("Loaded " + PRODS.length + " products");
  }catch(e){ say("Error: " + e.message, true); }
}

$("saveSet").onclick = function(){
  var c = cfg(); ls("owner", c.o); ls("repo", c.r); ls("token", c.t);
  loadProducts();
};

$("file").onchange = async function(){
  var f = this.files[0]; if(!f) return;
  try{
    say("Uploading photo...", true);
    var b = await resize(f, 800, "image/jpeg", 0.8);
    var path = "images/p" + Date.now() + ".jpg";
    await putFile(path, b, "Add photo");
    $("image").value = path; showPrev(); say("Photo uploaded");
  }catch(e){ say("Error: " + e.message, true); }
};
$("image").oninput = showPrev;

$("logoBtn").onclick = async function(){
  var f = $("logoFile").files[0];
  if(!f){ say("Choose a logo image first"); return; }
  try{
    say("Uploading logo...", true);
    var b = await resize(f, 400, "image/png");
    await putFile("images/logo.png", b, "Update logo");
    say("Logo uploaded. Refresh your store in a minute.");
  }catch(e){ say("Error: " + e.message, true); }
};

$("saveP").onclick = function(){
  var p = {
    name: $("name").value.trim(), category: $("category").value, price: $("price").value.trim(),
    link: $("link").value.trim(), image: $("image").value.trim(), desc: $("desc").value.trim()
  };
  if(!p.name || !p.link){ say("Name and link are required"); return; }
  if(editing >= 0) PRODS[editing] = p; else PRODS.unshift(p);
  clearForm(); mark(); drawList(); say("Saved. Tap Publish to site when ready.");
};
$("cancelP").onclick = clearForm;

$("bulkBtn").onclick = function(){
  var cat = $("bulkCat").value, n = 0;
  $("bulk").value.split("\n").forEach(function(line){
    var a = line.split("|").map(function(s){ return s.trim(); });
    if(a.length < 2 || !a[0] || !a[1]) return;
    PRODS.unshift({ name: a[0], category: cat, price: a[2] || "", link: a[1], image: "", desc: "" });
    n++;
  });
  if(n){ $("bulk").value = ""; mark(); drawList(); }
  say(n ? "Added " + n + " products. Tap Publish to site." : "No valid lines found. Use: Name | link | price");
};

$("filter").oninput = drawList;

$("pub").onclick = async function(){
  try{
    say("Publishing...", true);
    var txt = "const CATEGORIES = " + JSON.stringify(CATS, null, 2) + ";\n\nconst PRODUCTS = " + JSON.stringify(PRODS, null, 2) + ";\n";
    await putFile("products.js", enc(txt), "Update products");
    dirty = false; $("pub").textContent = "Publish to site";
    say("Published! It shows on the store in about a minute.");
  }catch(e){ say("Error: " + e.message, true); }
};

$("owner").value = ls("owner"); $("repo").value = ls("repo"); $("token").value = ls("token");
if(cfg().o && cfg().r && cfg().t) loadProducts();
window.onbeforeunload = function(){ if(dirty) return "Unpublished changes"; };
</script>
</body>
  </html>
